name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package .alfredworkflow
        run: bash scripts/package.sh CloudFlare-ImgBed.alfredworkflow

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            CloudFlare-ImgBed.alfredworkflow \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
